<ul class="keyfeatures">
    <li *ngFor="let feature of features" (click)="showpopup(feature)">
        <img src='{{feature.icon}}' alt="branding" />{{ feature.name }}
      </li>
</ul>

</div>

<div class="overlay" *ngIf="show" (click)="closeoverly($event)">
    <div class="popup">

        <div class="popupheading-caption">
                    <span (click)="closepopup()">
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="closeoverly"></mat-icon>
        </span>
        <h3>{{ selectedFeature?.name }}</h3>
        <p>{{ selectedFeature?.description }}</p>
        </div>
        <div class="servicelayout">
        <img src='{{ selectedFeature?.path }}' style="padding: 0px 32px;" />

            <ul class="servicelist">
            <li *ngFor="let work of selectedFeature?.brandingworks || []">
              {{ work }}
            </li>
          </ul>
        </div>
          
          
    </div>
</div>
